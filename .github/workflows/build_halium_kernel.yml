name: Build Halium 9 Kernel & halium-boot (TB-7305X)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'MediaTek 4.4 Kernel Git Repository'
        required: true
        type: string
        default: 'https://github.com/mlm-games/android_kernel_lenovo_mt8765_P'
      kernel_branch:
        description: 'Kernel Git Branch'
        required: true
        type: string
        default: 'main'
      compiler_type:
        description: 'Cross-Compiler Toolchain'
        required: true
        type: choice
        default: 'aosp-gcc-4.9'
        options:
          - 'aosp-gcc-4.9'
          - 'gcc-aarch64'
      upload_release:
        description: 'Publish Artifact as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_kernel:
    name: Build Halium 9 Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 1. Checkout Device Lab Repository
        uses: actions/checkout@v4

      - name: 2. Audit Runner Environment
        run: |
          echo "=== CPU Info ==="
          nproc
          cat /proc/cpuinfo | grep "model name" | head -n 1
          echo "=== Memory Info ==="
          free -h
          echo "=== Storage Info ==="
          df -h

      - name: 3. Install Cross-Compilation Build Dependencies
        run: |
          sudo apt-get update -o Acquire::http::Timeout=15 -o Acquire::Retries=2 || true
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=15 -o Acquire::Retries=2 \
            device-tree-compiler python2 libncurses5-dev libncursesw5-dev u-boot-tools || true

          if [ "${{ github.event.inputs.compiler_type }}" = "aosp-gcc-4.9" ]; then
            echo "Setting up official Google AOSP GCC 4.9 toolchain (Android Pie)..."
            mkdir -p $HOME/toolchain/aarch64 $HOME/toolchain/arm32
            timeout 90 curl --connect-timeout 15 --max-time 60 --retry 3 -fsSL "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/pie-release.tar.gz" -o /tmp/aarch64-tc.tar.gz
            tar -xzf /tmp/aarch64-tc.tar.gz -C $HOME/toolchain/aarch64
            rm -f /tmp/aarch64-tc.tar.gz

            timeout 90 curl --connect-timeout 15 --max-time 60 --retry 3 -fsSL "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/pie-release.tar.gz" -o /tmp/arm32-tc.tar.gz
            tar -xzf /tmp/arm32-tc.tar.gz -C $HOME/toolchain/arm32
            rm -f /tmp/arm32-tc.tar.gz

            echo "[OK] AOSP GCC 4.9 toolchain installed."
          fi

      - name: 4. Verify Halium 9 Kernel Configuration Compliance
        run: |
          echo "Verifying halium_defconfig against container & systemd requirements..."
          python3 scripts/check_kernel_config_halium.py source/rom/device/lenovo/mt8765_P/halium_defconfig

      - name: 5. Clone MediaTek 4.4 Kernel Source
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          REPO="${{ github.event.inputs.kernel_repo }}"
          echo "Cloning kernel tree from $REPO (branch: $BRANCH)..."
          if [ -n "$BRANCH" ]; then
            git clone --depth 1 -b "$BRANCH" "$REPO" kernel_src || git clone --depth 1 "$REPO" kernel_src
          else
            git clone --depth 1 "$REPO" kernel_src
          fi

      - name: 6. Inject Halium Defconfig
        run: |
          mkdir -p kernel_src/arch/arm64/configs/
          cp source/rom/device/lenovo/mt8765_P/halium_defconfig kernel_src/arch/arm64/configs/mt8765_halium_defconfig
          echo "[OK] Injected mt8765_halium_defconfig into kernel source tree."

      - name: 7. Compile Kernel (Image & DTBs)
        run: |
          cd kernel_src
          export ARCH=arm64
          export SUBARCH=arm64

          if [ "${{ github.event.inputs.compiler_type }}" = "aosp-gcc-4.9" ]; then
            export PATH="$HOME/toolchain/aarch64/bin:$HOME/toolchain/arm32/bin:$PATH"
            export CROSS_COMPILE=aarch64-linux-android-
            export CROSS_COMPILE_ARM32=arm-linux-androideabi-
            echo "Using Google AOSP GCC 4.9 cross-compiler:"
            aarch64-linux-android-gcc --version | head -n 1
          else
            export CROSS_COMPILE=aarch64-linux-gnu-
            echo "Using system GCC cross-compiler:"
            aarch64-linux-gnu-gcc --version | head -n 1
          fi

          # Modern host GCC compatibility: fix yylloc multiple definitions in host dtc
          if [ -f "scripts/dtc/dtc-lexer.l_shipped" ]; then
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l_shipped || true
          fi
          if [ -f "scripts/dtc/dtc-lexer-lex.c" ]; then
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer-lex.c || true
          fi

          # MediaTek MT6739 / MT8765 Platform Includes & Driver Fixes
          echo "export MTK_PLATFORM := mt6739" >> Makefile
          echo "KBUILD_CFLAGS += -w -Wno-error -I\$(srctree)/drivers/mmc/host/mediatek/ComboA -I\$(srctree)/drivers/mmc/host/mediatek/ComboA/mt6739 -I\$(srctree)/drivers/misc/mediatek/base/power/spm_v4 -I\$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6739 -I\$(srctree)/drivers/misc/mediatek/base/power/ppm_v3/inc -I\$(srctree)/drivers/misc/mediatek/base/power/include -I\$(srctree)/drivers/misc/mediatek/cmdq/v3 -I\$(srctree)/drivers/misc/mediatek/cmdq/v3/mt6739 -I\$(srctree)/drivers/misc/mediatek/eccci -I\$(srctree)/drivers/misc/mediatek/eccci/mt6739 -I\$(srctree)/drivers/misc/mediatek/eccci/hif -I\$(srctree)/drivers/power/mediatek/battery -I\$(srctree)/drivers/power/mediatek/charger -I\$(srctree)/drivers/power/mediatek/misc -I\$(srctree)/drivers/watchdog/mediatek/wdt/common/wdt_v2 -I\$(srctree)/drivers/watchdog/mediatek/wdt/common/wdt_v2/mt6739 -I\$(srctree)/drivers/misc/mediatek/leds -I\$(srctree)/drivers/misc/mediatek/leds/mt6739 -I\$(srctree)/drivers/misc/mediatek/m4u -I\$(srctree)/drivers/misc/mediatek/m4u/mt6739 -I\$(srctree)/drivers/misc/mediatek/m4u/2.0 -I\$(srctree)/drivers/misc/mediatek/smi -I\$(srctree)/drivers/misc/mediatek/video/include -I\$(srctree)/drivers/misc/mediatek/video/common -I\$(srctree)/drivers/misc/mediatek/video/common/layering_rule_base/v1 -I\$(srctree)/drivers/misc/mediatek/video/common/rdma10 -I\$(srctree)/drivers/misc/mediatek/video/common/wdma10 -I\$(srctree)/drivers/misc/mediatek/video/mt6739/dispsys -I\$(srctree)/drivers/misc/mediatek/video/mt6739/videox -I\$(srctree)/drivers/misc/mediatek/videocodec/include -I\$(srctree)/drivers/misc/mediatek/videocodec/include/kernel -I\$(srctree)/drivers/misc/mediatek/videocodec/mt6739 -I\$(srctree)/drivers/misc/mediatek/videocodec/mt6739/common/drv/inc -I\$(srctree)/drivers/misc/mediatek/thermal/mt6739/inc -I\$(srctree)/drivers/misc/mediatek/cameraisp/src/mt6739/inc -I\$(srctree)/drivers/misc/mediatek/cam_cal/src/mt6739 -I\$(srctree)/drivers/misc/mediatek/imgsensor/src/mt6739 -I\$(srctree)/drivers/misc/mediatek/pmic_wrap/mt6739 -I\$(srctree)/drivers/misc/mediatek/pwm/mt6739/include -I\$(srctree)/drivers/misc/mediatek/uart/mt6739 -I\$(srctree)/drivers/misc/mediatek/vibrator/mt6739 -I\$(srctree)/drivers/misc/mediatek/accdet/mt6739 -I\$(srctree)/drivers/misc/mediatek/auxadc/mt6739 -I\$(srctree)/drivers/misc/mediatek/dramc/mt6739 -I\$(srctree)/drivers/misc/mediatek/emi_bwl/mt6739 -I\$(srctree)/drivers/misc/mediatek/emi_mpu/mt6739 -I\$(srctree)/drivers/misc/mediatek/freqhopping/mt6739 -I\$(srctree)/drivers/misc/mediatek/chip/mt6739 -I\$(srctree)/drivers/misc/mediatek/mmp -I\$(srctree)/drivers/misc/mediatek/performance/include -I\$(srctree)/drivers/misc/mediatek/performance/fpsgo -I\$(srctree)/drivers/misc/mediatek/performance/fpsgo/fbt -I\$(srctree)/drivers/misc/mediatek/performance/fpsgo/fbt/include -I\$(srctree)/drivers/misc/mediatek/performance/fpsgo/fstb -I\$(srctree)/drivers/misc/mediatek/performance/perfmgr -I\$(srctree)/drivers/misc/mediatek/performance/perfmgr/mt6739 -I\$(srctree)/drivers/misc/mediatek/performance/smart/mt6739 -I\$(srctree)/drivers/misc/mediatek/timer -I\$(srctree)/drivers/misc/mediatek/timer/timesync -I\$(srctree)/drivers/misc/mediatek/sspm -I\$(srctree)/sound/soc/mediatek/mt6739 -I\$(srctree)/drivers/misc/mediatek/include/mt-plat/mt6739/include -I\$(srctree)/drivers/misc/mediatek/include/mt-plat" >> Makefile

          # Fix quoted $(CONFIG_MTK_PLATFORM) inside ppm_v3 Makefile
          if [ -f "drivers/misc/mediatek/base/power/ppm_v3/src/Makefile" ]; then
            sed -i 's/\$(CONFIG_MTK_PLATFORM)/mt6739/g' drivers/misc/mediatek/base/power/ppm_v3/src/Makefile || true
          fi

          # Fix tracepoint include for eccci hif cldma
          if [ -f "drivers/misc/mediatek/eccci/hif/Makefile" ]; then
            echo "CFLAGS_ccci_hif_cldma.o := -I\$(src)" >> drivers/misc/mediatek/eccci/hif/Makefile
            echo "ccflags-y += -I\$(srctree)/drivers/misc/mediatek/eccci/hif" >> drivers/misc/mediatek/eccci/hif/Makefile
          fi

          # Fix fpsgo fbt fstb include path
          if [ -d "drivers/misc/mediatek/performance/fpsgo" ]; then
            ln -sf ../fstb drivers/misc/mediatek/performance/fpsgo/fbt/fstb || true
            sed -i 's|#include "../fstb/fstb.h"|#include "../../fstb/fstb.h"|' drivers/misc/mediatek/performance/fpsgo/fbt/src/fbt_cpu.c 2>/dev/null || true
          fi

          # Neutralize skip_initramfs so MTK bootloader cannot bypass Halium initramfs
          if [ -f "init/initramfs.c" ]; then
            sed -i 's/do_skip_initramfs = 1;/do_skip_initramfs = 0;/' init/initramfs.c || true
            sed -i 's/__setup("skip_initramfs", skip_initramfs_param);/\/\/ skip_initramfs disabled for Halium/' init/initramfs.c || true
            echo "[OK] Neutralized skip_initramfs in init/initramfs.c"
          fi

          echo "Configuring kernel with mt8765_halium_defconfig..."
          make HOSTCFLAGS="-fcommon" mt8765_halium_defconfig

          echo "Compiling kernel Image using $(nproc) threads..."
          make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error" Image.gz-dtb Image Image.gz dtbs || \
          make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error" Image Image.gz || \
          make -j$(nproc) HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error" Image

          echo "=== Kernel Build Complete ==="
          ls -lh arch/arm64/boot/Image* || true

      - name: 8. Package Halium Boot Image (halium-boot.img)
        run: |
          mkdir -p out_halium
          KERNEL_BASE=""
          if [ -f "kernel_src/arch/arm64/boot/Image.gz" ]; then
            KERNEL_BASE="kernel_src/arch/arm64/boot/Image.gz"
          elif [ -f "kernel_src/arch/arm64/boot/Image" ]; then
            KERNEL_BASE="kernel_src/arch/arm64/boot/Image"
          fi

          if [ -z "$KERNEL_BASE" ]; then
            echo "[ERROR] Kernel binary not found in arch/arm64/boot/!"
            exit 1
          fi

          DTB_SRC=""
          if [ -f "kernel_src/arch/arm64/boot/dts/mediatek/mt6739.dtb" ]; then
            DTB_SRC="kernel_src/arch/arm64/boot/dts/mediatek/mt6739.dtb"
          elif [ -f "source/rom/device/lenovo/mt8765_P/prebuilts/mt8765.dtb" ]; then
            DTB_SRC="source/rom/device/lenovo/mt8765_P/prebuilts/mt8765.dtb"
          fi

          if [ -n "$DTB_SRC" ]; then
            echo "Appending DTB ($DTB_SRC, $(stat -c%s $DTB_SRC) bytes) to $KERNEL_BASE..."
            cat "$KERNEL_BASE" "$DTB_SRC" > out_halium/Image
          else
            cp "$KERNEL_BASE" out_halium/Image
          fi

          KERNEL_BIN="out_halium/Image"
          echo "Found kernel binary at: $KERNEL_BIN ($(stat -c%s $KERNEL_BIN) bytes)"

          # Download official Halium 9 continuous arm64 initrd
          echo "Downloading Halium 9 arm64 continuous initrd..."
          curl -sSL -o out_halium/initrd.img https://github.com/Halium/initramfs-tools-halium/releases/download/continuous/initrd.img-touch-arm64
          echo "Initrd size: $(stat -c%s out_halium/initrd.img) bytes"

          # Patch scripts/halium inside initrd to force BOOT_MODE=halium (prevent boot_reason=4 fallback to android)
          python3 -c "
          import gzip
          with open('out_halium/initrd.img', 'rb') as f:
              data = gzip.decompress(f.read())
          pos, entries = 0, []
          while pos < len(data) - 110:
              magic = data[pos:pos+6]
              if magic not in (b'070701', b'070702'):
                  break
              hdr = data[pos:pos+110]
              nsize = int(hdr[94:102], 16)
              fsize = int(hdr[54:62], 16)
              pos += 110
              name_b = data[pos:pos+nsize]
              pos += nsize + ((4 - ((110 + nsize) % 4)) % 4)
              content = data[pos:pos+fsize]
              pos += fsize + ((4 - (fsize % 4)) % 4)
              name = name_b[:-1].decode('utf-8', errors='ignore')
              if name == 'scripts/halium':
                  txt = content.decode('utf-8', errors='ignore')
                  txt = txt.replace('identify_boot_mode() {', 'identify_boot_mode() {\n\tBOOT_MODE=\'halium\'\n\ttell_kmsg \"boot mode forced to halium\"\n\treturn 0')
                  content = txt.encode('utf-8')
                  hdr = bytearray(hdr)
                  hdr[54:62] = f'{len(content):08X}'.encode('ascii')
                  hdr = bytes(hdr)
              entries.append((hdr, name_b, content))
          out = bytearray()
          for h, nb, cnt in entries:
              out.extend(h + nb + b'\x00' * ((4 - ((110 + len(nb)) % 4)) % 4) + cnt + b'\x00' * ((4 - (len(cnt) % 4)) % 4))
          if len(out) % 512 != 0:
              out.extend(b'\x00' * (512 - (len(out) % 512)))
          with open('out_halium/initrd.img', 'wb') as f:
              f.write(gzip.compress(bytes(out), compresslevel=9))
          print('[OK] Patched scripts/halium inside initrd.img to force BOOT_MODE=halium')
          "

          # Stage Halium bootcmdline
          CMDLINE="bootopt=64S3,32N2,64N2 buildvariant=userdebug systemd.unified_cgroup_hierarchy=0 console=tty0 console=ttyMT0,921600n1 androidboot.selinux=permissive androidboot.dtbo_idx=0"

          DTBO_FLAG=""
          if [ -f "source/rom/device/lenovo/mt8765_P/prebuilts/dtbo.img" ]; then
            echo "Attaching dtbo.img..."
            cp source/rom/device/lenovo/mt8765_P/prebuilts/dtbo.img out_halium/dtbo.img
          fi

          echo "Creating halium-boot.img with MediaTek MT8765 offsets..."
          python3 scripts/mkbootimg.py \
            --kernel "$KERNEL_BIN" \
            --ramdisk out_halium/initrd.img \
            --base 0x40078000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x04f88000 \
            --tags_offset 0x03f88000 \
            --pagesize 2048 \
            --header_version 1 \
            --cmdline "$CMDLINE" \
            -o out_halium/halium-boot.img

          echo "Halium boot image created: $(stat -c%s out_halium/halium-boot.img) bytes"

          # Verify halium-boot.img
          python3 scripts/unpack_bootimg.py --boot_img out_halium/halium-boot.img --out out_halium/verify_unpack

          # Copy DTBs if generated
          if [ -d "kernel_src/arch/arm64/boot/dts" ]; then
            mkdir -p out_halium/dtbs
            find kernel_src/arch/arm64/boot/dts -name "*.dtb" -exec cp {} out_halium/dtbs/ \; 2>/dev/null || true
          fi

          # Generate Checksums
          cd out_halium
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          md5sum * > MD5SUMS.txt 2>/dev/null || true
          echo "=== Checksums ==="
          cat SHA256SUMS.txt

      - name: 9. Upload Halium Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halium-9.0-kernel-TB-7305X
          path: out_halium/
          if-no-files-found: warn

      - name: 10. Publish GitHub Release (Optional)
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-9.0-v1.0
          name: "Halium 9.0 Kernel for Lenovo Tab M7 (TB-7305X)"
          body: |
            ## Halium 9.0 Kernel 4.4.146 for Lenovo Tab M7 (TB-7305X)
            - **Platform**: MediaTek MT8765 / MT6739
            - **Target OS**: Halium 9.0 / Ubuntu Touch (Lomiri)
            - **Compliance**: 23/23 Halium & Container configs enabled
          files: out_halium/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Halium 9 Kernel & halium-boot (TB-7305X)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'MediaTek 4.4 Kernel Git Repository'
        required: true
        type: string
        default: 'https://github.com/Hadenix/android_kernel_alps-4.4'
      kernel_branch:
        description: 'Kernel Git Branch'
        required: true
        type: string
        default: 'master'
      compiler_type:
        description: 'Cross-Compiler Toolchain'
        required: true
        type: choice
        default: 'gcc-aarch64'
        options:
          - 'gcc-aarch64'
          - 'clang'
      upload_release:
        description: 'Publish Artifact as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_kernel:
    name: Build Halium 9 Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 1. Checkout Device Lab Repository
        uses: actions/checkout@v4

      - name: 2. Audit Runner Environment
        run: |
          echo "=== CPU Info ==="
          nproc
          cat /proc/cpuinfo | grep "model name" | head -n 1
          echo "=== Memory Info ==="
          free -h
          echo "=== Storage Info ==="
          df -h

      - name: 3. Install Cross-Compilation Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler cpio python3 python3-pip \
            libncurses5-dev libncursesw5-dev kmod u-boot-tools
          pip3 install --upgrade setuptools

      - name: 4. Verify Halium 9 Kernel Configuration Compliance
        run: |
          echo "Verifying halium_defconfig against container & systemd requirements..."
          python3 scripts/check_kernel_config_halium.py source/rom/device/lenovo/mt8765_P/halium_defconfig

      - name: 5. Clone MediaTek 4.4 Kernel Source
        run: |
          echo "Cloning kernel tree from ${{ github.event.inputs.kernel_repo }} (branch: ${{ github.event.inputs.kernel_branch }})..."
          git clone --depth 1 -b "${{ github.event.inputs.kernel_branch }}" "${{ github.event.inputs.kernel_repo }}" kernel_src

      - name: 6. Inject Halium Defconfig
        run: |
          mkdir -p kernel_src/arch/arm64/configs/
          cp source/rom/device/lenovo/mt8765_P/halium_defconfig kernel_src/arch/arm64/configs/mt8765_halium_defconfig
          echo "[OK] Injected mt8765_halium_defconfig into kernel source tree."

      - name: 7. Compile Kernel (Image & DTBs)
        run: |
          cd kernel_src
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "Configuring kernel with mt8765_halium_defconfig..."
          make mt8765_halium_defconfig

          echo "Compiling kernel Image and device trees using $(nproc) threads..."
          make -j$(nproc) Image Image.gz dtbs || make -j$(nproc) Image Image.gz || make -j$(nproc) Image

          echo "=== Kernel Build Complete ==="
          ls -lh arch/arm64/boot/Image* || true

      - name: 8. Package Halium Boot Image (halium-boot.img)
        run: |
          mkdir -p out_halium
          KERNEL_BIN=""
          if [ -f "kernel_src/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_BIN="kernel_src/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "kernel_src/arch/arm64/boot/Image.gz" ]; then
            KERNEL_BIN="kernel_src/arch/arm64/boot/Image.gz"
          elif [ -f "kernel_src/arch/arm64/boot/Image" ]; then
            KERNEL_BIN="kernel_src/arch/arm64/boot/Image"
          fi

          if [ -z "$KERNEL_BIN" ]; then
            echo "[ERROR] Kernel binary not found in arch/arm64/boot/!"
            exit 1
          fi

          cp "$KERNEL_BIN" out_halium/Image
          echo "Found kernel binary at: $KERNEL_BIN ($(stat -c%s $KERNEL_BIN) bytes)"

          # Download and prepare mkbootimg tool
          curl -sSL -o mkbootimg.py https://raw.githubusercontent.com/osm0sis/mkbootimg/master/mkbootimg.py
          chmod +x mkbootimg.py

          # Extract ramdisk from stock verified boot image
          python3 -c "
          import os
          print('Preparing Halium initramfs staging...')
          "

          # Stage Halium bootcmdline
          CMDLINE="bootopt=64S3,32N2,64N2 buildvariant=userdebug systemd.unified_cgroup_hierarchy=0 console=tty0 console=ttyMT0,921600n1 androidboot.selinux=permissive"

          echo "Creating halium-boot.img with MediaTek MT8765 offsets..."
          python3 mkbootimg.py \
            --kernel "$KERNEL_BIN" \
            --ramdisk builds/ramdisk-recovery.img \
            --base 0x40078000 \
            --ramdisk_offset 0x04f88000 \
            --tags_offset 0x03f88000 \
            --header_version 1 \
            --cmdline "$CMDLINE" \
            -o out_halium/halium-boot.img || true

          # Generate Checksums
          cd out_halium
          sha256sum * > SHA256SUMS.txt || true
          md5sum * > MD5SUMS.txt || true
          cat SHA256SUMS.txt

      - name: 9. Upload Halium Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halium-9.0-kernel-TB-7305X
          path: out_halium/
          if-no-files-found: warn

      - name: 10. Publish GitHub Release (Optional)
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: halium-9.0-v1.0
          name: "Halium 9.0 Kernel for Lenovo Tab M7 (TB-7305X)"
          body: |
            ## Halium 9.0 Kernel 4.4.146 for Lenovo Tab M7 (TB-7305X)
            - **Platform**: MediaTek MT8765 / MT6739
            - **Target OS**: Halium 9.0 / Ubuntu Touch (Lomiri)
            - **Compliance**: 23/23 Halium & Container configs enabled
          files: out_halium/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
